name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  swift-test:
    name: Swift tests
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: >-
          swift test -c debug
          -Xswiftc -F -Xswiftc "$GITHUB_WORKSPACE"
          -Xlinker -F -Xlinker "$GITHUB_WORKSPACE"
          -Xlinker -rpath -Xlinker @executable_path/../Frameworks
